[package]
name = "game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autobenches = false

[features]
default = []
factory = ["dep:factory"]
dim2 = ["bevy/2d", "game-physics/dim2", "game-shaders/dim2"]
dim3 = ["bevy/3d", "game-physics/dim3", "game-shaders/dim3"]
networked = [] # Deferred until Lightyear supports Bevy 0.20.
mcp = ["dep:bevy_brp_extras", "bevy/bevy_remote", "bevy/sysinfo_plugin"]
web = ["bevy/webgl2"]
dev = ["bevy/dev", "game-shaders/dev"]
dynamic_linking = ["bevy/dynamic_linking"]
trace_chrome = ["bevy/trace_chrome"]
trace_tracy = ["bevy/trace_tracy"]

[dependencies]
bevy.workspace = true
factory = { workspace = true, optional = true }
bevy_enhanced_input = { workspace = true, optional = true }
game-physics.workspace = true
game-settings.workspace = true
game-shaders.workspace = true
serde = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy_brp_extras = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "simulation"
harness = false
required-features = ["networked"]

[[test]]
name = "network_demo"
required-features = ["networked"]

[lints]
workspace = true
