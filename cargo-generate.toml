[template]
cargo_generate_version = ">=0.25.0"
include = ["template/**"]
ignore = ["target", ".direnv", ".git", "result*", ".claude/**", ".cursor/**", ".opencode/**", ".codex/AGENTS.md", ".codex/skills", "CLAUDE.md", "docs/book", "local", "dist", "platform/android/.gradle", "platform/android/app/build", "platform/android/app/src/main/jniLibs", "scripts/__pycache__", ".ruff_cache"]

[placeholders]
factory = { type = "bool", prompt = "Use touch-first factory example?", default = false }
dimension = { type = "string", prompt = "Game dimensions", choices = ["2d", "3d", "both"], default = "2d" }
networked = { type = "bool", prompt = "Lightyear unavailable on Bevy 0.20; leave false", default = false }
skein = { type = "bool", prompt = "Skein unavailable on Bevy 0.20; leave false", default = false }
mcp = { type = "bool", prompt = "Enable BRP/MCP inspection?", default = true }
web = { type = "bool", prompt = "Enable browser builds with Trunk?", default = false }

[hooks]
post = [".agents/post-generate.rhai"]
